<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DnsResolver" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1130"/>
      <stop offset="100%" stop-color="#070B18"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B7FD0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141C3A" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#070B18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#070B18" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#fade)"/>

  <!-- left icon: globe with resolving node lines -->
  <g transform="translate(122,100)" fill="none" stroke="#F97316" stroke-width="1.6" opacity="0.65" stroke-linecap="round">
    <circle cx="28" cy="28" r="26"/>
    <ellipse cx="28" cy="28" rx="12" ry="26"/>
    <path d="M2 28 H54"/>
    <path d="M6 15 H50"/>
    <path d="M6 41 H50"/>
    <circle cx="28" cy="28" r="3" fill="#F97316" stroke="none"/>
    <path d="M28 28 L46 10" stroke-dasharray="2 3"/>
    <circle cx="48" cy="8" r="3" fill="#F97316" stroke="none"/>
  </g>

  <!-- right icon: server/record stack -->
  <g transform="translate(1022,96)" fill="none" stroke="#DC2626" stroke-width="1.6" opacity="0.65" stroke-linecap="round">
    <rect x="0" y="0" width="56" height="16" rx="3"/>
    <rect x="0" y="20" width="56" height="16" rx="3"/>
    <rect x="0" y="40" width="56" height="16" rx="3"/>
    <circle cx="8" cy="8" r="1.6" fill="#DC2626" stroke="none"/>
    <circle cx="8" cy="28" r="1.6" fill="#DC2626" stroke="none"/>
    <circle cx="8" cy="48" r="1.6" fill="#DC2626" stroke="none"/>
  </g>

  <text x="600" y="155" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="4"
        fill="url(#titleGradient)" filter="url(#glow)">DnsResolver</text>

  <rect x="400" y="185" width="400" height="2" fill="url(#lineGradient)"/>

  <text x="600" y="220" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" letter-spacing="2" fill="#8FA4C0">HIGH-PERFORMANCE ASYNCHRONOUS DNS RESOLUTION LIBRARY FOR C++</text>
</svg>
